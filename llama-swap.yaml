# llama-swap runs the same tuned `llama-server` commands the cvm-pdf-processor scripts used
# (start-proventos-server-gpu.sh / start-repair-server-gpu.sh), but on demand: it picks the
# model by the request's "model" field and hot-swaps (unload one, load the other) so the single
# GPU is shared. Flags below are copied verbatim from those scripts — only --port is ${PORT}
# (llama-swap assigns it so it can proxy to the server it started).
#
# Run:  llama-swap --config llama-swap.yaml --listen 0.0.0.0:8080
# llm-proxy's llama-cpp.base-url already points here (:8080).
#
# Embeddings (bge-m3) live in their own non-swap group below: they coexist with whichever
# chat model is loaded instead of swapping it out (small model, small VRAM footprint).

macros:
  server: "/home/giovanehl2/Documentos/repo/llama-cpp-turboquant/build/bin/llama-server"
  models: "/home/giovanehl2/Documentos/repo/Models-llm"

# chat: 14b/35b swap between themselves; embeddings: bge-m3 loads alongside them
# (exclusive: false on both, so neither group unloads the other).
groups:
  chat:
    swap: true
    exclusive: false
    members: ["qwen3-14b", "qwen3.6-35b", "qwen3.8-27b", "qwen3.8-27b-iq4xs", "qwen3.5-9b", "gemma-4-26b"]
  embeddings:
    swap: false
    exclusive: false
    members: ["bge-m3", "bge-m3-gpu", "bge-reranker-v2-m3"]

models:
  # Dense 14B — default proventos/eventos extraction. cvm sends model="qwen3-14b".
  # From start-proventos-server-gpu.sh (KV-cache q8_0/q8_0, ctx 70k, all layers on GPU).
  # --no-mmap/--mlock removidas (2026-08-14): mesma razão do bge-m3-gpu (linhas abaixo) —
  # com -ngl 999 os pesos já estão todos na GPU, essas flags só forçavam uma cópia adicional
  # travada em RAM do host (~600MB-1GB) que o kernel nunca podia recuperar sob pressão de
  # memória. -t 4 -> 8: 8 cores físicos disponíveis (Ryzen 7 5700X), sem motivo pra travar em 4.
  qwen3-14b:
    cmd: >
      ${server}
      -m ${models}/qwen3-14b.gguf
      --flash-attn on
      -ngl 999
      -c 70000
      -t 8
      --cache-type-k q4_0
      --cache-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
    # Unload after 10 min idle so the GPU frees up for the 35B/embeddings when extraction is quiet.
    ttl: 600

  # Embeddings bge-m3 — CPU/RAM (-ngl 0), zero VRAM: nunca compete com os modelos de chat.
  # Flags da variante CPU do antigo start-embed-server.sh; -c = 4 slots * 8192 (max do bge-m3).
  # -b/-ub 8192: llama.cpp exige que cada input de embedding caiba inteiro num physical batch
  # (não trunca, rejeita com 500); ~11,9% dos chunks do cvm-pdf-processor passam de 512 tokens.
  # 8192 = teto de contexto do bge-m3. --flash-attn on: mesmo build já suporta (usado no qwen3-14b).
  # TODO: medir RSS real após subir o servidor (`ps -o rss= -p $(pgrep -f bge-m3)`); se não couber
  # em ~12GB disponíveis, trocar -ub 8192 por -ub 4096 (cobre 99,94% dos chunks).
  bge-m3:
    cmd: >
      ${server}
      -m ${models}/bge-m3-Q8_0.gguf
      --embedding
      --pooling mean
      -ngl 0
      -c 32768
      -t 8
      -b 8192
      -ub 8192
      --flash-attn on
      -np 4
      --threads-http 4
      --cache-ram 0
      --ctx-checkpoints 0
      --host 127.0.0.1
      --port ${PORT}
    ttl: 600

  # Embeddings bge-m3 — GPU (-ngl 999), -np 8 slots simultâneos. SPEC-embedding-gpu-profile:
  # viável agora porque nenhuma etapa de extração via IA roda mais (chat models não sobem),
  # então os 16GB de VRAM estão livres — antes só cabiam ~2GB livres com qwen3.6-35b carregado.
  # -c 16384 = 2 slots * 8192 (teto de contexto do bge-m3), mesma regra do perfil CPU (32768/4).
  # Ativar via env EMBED_MODEL=bge-m3-gpu no cvm-pdf-processor; bge-m3 (CPU) fica como fallback.
  # -np era 8, depois 4: sob carga real (runs completos de 300k+ chunks) o processo não
  # estabiliza — anon-rss+shmem-rss cresce continuamente até estourar o MemoryMax do cgroup
  # (12G em 5min47s com -np 8; 18G em 4min55s com -np 4 — mesma taxa por slot, não é só
  # startup). Medido ao vivo em 2026-08-09: ~24 MB de RSS vazados por requisição /v1/embeddings
  # — bate com -ub 8192 * n_embd 1024 * 4 bytes (f32) = 33,5 MB, i.e. o vazamento parece ser uma
  # alocação por-requisição dimensionada pelo ubatch físico e nunca liberada (não um buffer
  # estático de startup, que explicaria a mesma taxa por tempo independente de -np: menos slots
  # = menos throughput = mesmo vazamento por requisição = mesma taxa por tempo). -ub/-b reduzidos
  # de 8192 para 2048 como experimento (E1 do diagnóstico) — se o MB/requisição cair ~4x,
  # confirma a hipótese e já é mitigação real, não só paliativo. Ver
  # project-specs/llm-proxy/decisions.md e llm-proxy/scripts/measure-embed-leak.sh.
  # --no-mmap/--mlock removidas: com -ngl 999 os pesos já estão todos na GPU, essas flags só
  # forçavam uma cópia adicional travada em RAM do host (~600MB-1GB) que o kernel nunca podia
  # recuperar sob pressão de memória — ganho puro, independente do vazamento.
  # CAUSA RAIZ ACHADA (2026-08-09, análise de código, não era bug): o "vazamento" era o prompt
  # cache do llama.cpp (server-context.cpp/server-task.cpp), ligado por padrão com orçamento de
  # 8192 MiB de RAM do host (common/common.h: cache_ram_mib=8192) — a cada requisição, todo slot
  # ocioso é serializado pra esse cache (cache_idle_slots, default ligado) e só é despejado
  # depois de estourar o limite. Pra chat multi-turno isso é útil (reaproveita prefixo); pra
  # embeddings (cada chunk é um documento distinto, sem prefixo comum) é RAM jogada fora sem
  # nenhum ganho. --cache-ram 0 desliga o cache por completo (confirmado no código: com 0 o
  # cache nem é instanciado). Ver project-specs/llm-proxy/decisions.md.
  # -c/-b/-ub revertidos pro valor original (2026-08-09) — a redução pra 2048 era mitigação de
  # quando ainda parecia ser vazamento correlacionado a batch; com --cache-ram 0 (causa raiz
  # real) confirmado sem crescimento de RSS, não há motivo pra manter a cobertura reduzida.
  bge-m3-gpu:
    cmd: >
      ${server}
      -m ${models}/bge-m3-Q8_0.gguf
      --embedding
      --pooling mean
      -ngl 999
      -c 16384
      -b 8192
      -ub 8192
      --flash-attn on
      -np 2
      --threads-http 2
      --cache-ram 0
      --ctx-checkpoints 0
      --host 127.0.0.1
      --port ${PORT}
    ttl: 600

  # Reranker cross-encoder — companheiro do bge-m3, mesma família/quantização (Q8_0, ~606MB).
  # Estágio 2 do retrieval do LazyInvest (SPEC/decisions.md: coseno do bge-m3 fica comprimido
  # nesse domínio — 0,67 irrelevante vs 0,80 relevante, ~0,08 de distância — e não discrimina
  # nada; o reranker processa query+chunk juntos e devolve score bem espalhado). Confirmado
  # manualmente em 2026-08-10: candidatos reais entre -1,14 e -4,20, controle irrelevante em
  # -9,54/-11,04 — gap de 5,3 pontos entre o pior candidato real e o melhor controle.
  # --pooling rank + --reranking habilitam o endpoint /v1/rerank. -ngl 999: GPU tem folga
  # (14,8GB livres de 16,3GB mesmo com bge-m3-gpu carregado — modelo é pequeno). Mesmas
  # mitigações de RAM do bge-m3-gpu (--cache-ram 0, --ctx-checkpoints 0) — mesma causa raiz
  # (prompt cache) se aplicaria aqui, mas sem prefixo comum entre requests de rerank.
  bge-reranker-v2-m3:
    cmd: >
      ${server}
      -m ${models}/bge-reranker-v2-m3-Q8_0.gguf
      --reranking
      --pooling rank
      -ngl 999
      -c 8192
      -np 2
      --threads-http 2
      --cache-ram 0
      --ctx-checkpoints 0
      --host 127.0.0.1
      --port ${PORT}
    ttl: 600

  # 35B MoE (experts offloaded to CPU) — repair pass for NEEDS_REVIEW docs.
  # From start-repair-server-gpu.sh (--n-cpu-moe 18, --parallel 1, --threads-http 2).
  # --cache-ram 2048 (2026-08-09): rodando junto com bge-m3-gpu (embeddings, grupo não
  # exclusive), o cgroup do llama-swap.service já bateu 9,9G/10G só com os pesos MoE
  # offloaded pra RAM + o prompt cache default de 8192MiB sem teto. Cache continua ligado
  # (multi-turno se beneficia aqui, diferente de embeddings) mas com orçamento reduzido pra
  # não deixar esse modelo sozinho consumir o cap inteiro. Ver decisions.md.
  # --reasoning off: o prefixo /no_think do LazyInvest (agent.no-think-prefix) só é entendido
  # pelo template do Qwen3 original (14b). Medido em 2026-08-15: o 3.6-35b ignorou o comando,
  # gastou 395 tokens de thinking e ainda o citou dentro do raciocínio. Cliente que quiser
  # thinking de volta manda chat_template_kwargs.enable_thinking=true na requisição.
  qwen3.6-35b:
    cmd: >
      ${server}
      --model ${models}/Qwen3.6-35B-A3B-Q4_K_M.gguf
      --reasoning off
      --ctx-size 70000
      --parallel 1
      --threads-http 2
      --n-gpu-layers 999
      --n-cpu-moe 18
      --cache-ram 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --host 127.0.0.1
      --port ${PORT}
    # ttl 3600 (era 600): voltar ao chat depois de uma pausa de 10min pagava o load dos
    # pesos (~21GB) na primeira pergunta (~30-90s além da geração). Embeddings coexistem
    # (exclusive: false); a troca com o 14B de extração continua normal.
    ttl: 3600

  # Gemma 4 26B-A4B MoE (2026-08-28) — opção de chat p/ análise financeira / RAG /
  # tool calling. NÃO é o default (LOCAL_LLAMA_MODEL segue qwen3-14b; LazyInvest segue
  # qwen3.6-35b). Arquivo gemma-4-26B-A4B-it-QAT-Q4_0.gguf
  # (14,4 GB, QAT Q4_0 oficial Google). Arch gemma4: 30 layers, 128 experts / 8 ativos,
  # atenção intercalada — 25 layers sliding-window (1024) + 5 globais, ctx nativo 256K.
  # Mesma filosofia do qwen3.6-35b: -ngl 999 + --n-cpu-moe p/ caber nos 16 GB com o
  # bge-m3-gpu co-residente. --n-cpu-moe 10 = ponto de partida (só ~7-10 dos 30 layers
  # de experts precisam sair da GPU); AJUSTAR após benchmark — sweep 6/8/10/12/14 e
  # llama-fit-params. Se der CUDA OOM no load, subir; se bge-m3-gpu estiver descarregado
  # (timer 4min, ADR-004) dá pra descer p/ 4-6.
  # --ctx-size 51200 = ~50K. KV q4_0 + --flash-attn on (obrigatório p/ V quantizado).
  # SEM --swa-full: com iSWA o KV a 50K fica ~0,35 GB; --swa-full subiria p/ ~3 GB e
  # estoura VRAM. Custo: prompt cujo prefixo muda entre requests reprocessa inteiro
  # (aceitável com --parallel 1, é só latência do 1º token).
  # --reasoning off: padrão da casa (ADR-007); o template do Gemma 4 vem com thinking=1.
  # --temp 0: determinismo p/ extração/tool calling; o proxy já força temperature=0.0
  # (ADR-010), aqui é redundância. Sobrescreve o sampling recomendado do Gemma (temp 1.0);
  # se resumo aberto ficar "chapado", testar 0.3-0.7 chamando o llama-server direto.
  # -t 8: 8 cores físicos (Ryzen 7 5700X), crítico com experts na CPU.
  # Tool calling: o GGUF traz tokens <|tool_response> e template próprio (marcações
  # <|turn>, não <start_of_turn>). Se tool_calls não fizer parse, adicionar --jinja.
  # MTP/speculative: indisponível — este GGUF não tem tensores blk.N.nextn.* e os
  # drafters oficiais do Gemma 4 ainda não convertem p/ llama.cpp (disc. ggml-org #22735).
  gemma-4-26b:
    cmd: >
      ${server}
      --model ${models}/gemma-4-26B-A4B-it-QAT-Q4_0.gguf
      --reasoning off
      --ctx-size 51200
      --parallel 1
      --threads-http 2
      -t 8
      --n-gpu-layers 999
      --n-cpu-moe 10
      --cache-ram 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --temp 0
      --host 127.0.0.1
      --port ${PORT}
    ttl: 3600

  # Dense 27B (2026-08-14) — opção de chat, NÃO é o default (LOCAL_LLAMA_MODEL continua
  # qwen3-14b; fastModel/analysisModel do LazyInvest continuam qwen3.6-35b). Diferente do
  # 35B (MoE, ~3B ativos por token), este é denso: os 15,66 GiB de pesos Q4_K_M já ocupam
  # 98% dos 15,92 GiB de VRAM da 5070 Ti sozinhos, e todo layer offloaded pra CPU processa
  # todo token (sem o escape --n-cpu-moe). -ngl 46/-c 32768 medidos com llama-fit-params
  # (build TurboQuant) com bge-m3-gpu+reranker já carregados (2,4GB) — 19 dos 65 layers
  # ficam na CPU. Testado --cache-type-v turbo2 (TurboQuant): ngl idêntico ao q4_0 puro,
  # porque head_count_kv=4 (GQA) já deixa o cache V pequeno — sem ganho de VRAM, então
  # fica de fora (turbo nunca deve ir no K, e no V aqui não compra nada). Medido ao vivo:
  # ~6,6 tok/s de geração baseline (offload parcial) — mais lento que o 35B MoE.
  # --spec-type draft-mtp: este GGUF carrega um head MTP nativo (tensores blk.64.nextn.*,
  # estilo DeepSeek-V3), auto-especulação sem modelo draft separado. Medido ao vivo
  # (2026-08-14): 6,6 -> 14,3 tok/s (2,16x), aceitação 62,5% (30/48 tokens), custo de só
  # +258MiB VRAM (log: "estimated memory usage of MTP context"). Ganho grande o bastante
  # pra já entrar habilitado por padrão aqui, diferente do turbo KV (que não deu ganho
  # nenhum, ver medição acima). Alternativa se ainda não bastar: requantizar pra TQ3_1S
  # (4,00 bpw, ~12,6GB, cabe 100% na GPU sem precisar de offload) — ver decisions.md.
  # --reasoning off: mesmo motivo do 3.6-35b acima. Medido em 2026-08-15 com /no_think:
  # 127 tokens de saída em 19,5s; com --reasoning off, 43 tokens em 6,0s e a mesma resposta.
  # --spec-draft-n-max 2: profundidade de draft do MTP (default 3). --spec-draft-p-min é 0.0
  # por padrão, então o llama.cpp nunca corta cedo por baixa confiança — sempre especula até o
  # teto de n_max. Medido ao vivo (2026-08-17), 5 prompts, timings.draft_n/draft_n_accepted:
  # n_max=1: ~75% aceitação, ~10,3 tok/s | n_max=2: ~61% aceitação, ~10,7 tok/s (melhor) |
  # n_max=3 (default): ~50%, ~10,5 tok/s | n_max=4: ~40%, ~9,0 tok/s (pior — draft raso rende
  # mais que draft fundo aqui). Amostra pequena, reavaliar se a carga de uso mudar muito.
  qwen3.8-27b:
    cmd: >
      ${server}
      -m ${models}/Qwen3.8-27B-Q4_K_M.gguf
      --reasoning off
      --ctx-size 32768
      --parallel 1
      --threads-http 2
      -t 8
      --n-gpu-layers 46
      --cache-ram 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --host 127.0.0.1
      --port ${PORT}
    ttl: 3600

  # Dense 27B IQ4_XS (2026-08-18) — variante de menor qualidade/menor peso do 3.8-27b,
  # entrada própria porque o tamanho diferente exige -ngl próprio. Não é o default
  # (LOCAL_LLAMA_MODEL continua qwen3-14b; LazyInvest continua no qwen3.6-35b/3.8-27b).
  # GGUF unsloth (~15,7GB, 4,25 bpw vs 4,85 bpw do Q4_K_M) — arquitetura qwen35 híbrida
  # (SSM + atenção, 65 layers), mesmo com head MTP nativo (tensores blk.64.nextn.*).
  # -ngl 58 medido com llama-fit-params (build TurboQuant) em 2026-08-18: ctx 32768 +
  # KV q4_0/q4_0 + margem padrão de 1GiB — vs 54 do Q4_K_M (46 no entry acima, medido
  # com bge-m3-gpu+reranker coexistindo, 2,4GB). Atenção: com as embeddings carregadas
  # (grupo exclusive: false) a VRAM do chat cai ~2,4GB e o ngl efetivo real é menor —
  # se for rodar em coexistência, rebaixar -ngl ou descarregar embeddings antes.
  # IQ4_XS é visivelmente pior que Q4_K_M em qualidade — só compensa se o objetivo é
  # espremer mais layers na GPU. Demais flags espelham o qwen3.8-27b (reasoning off,
  # MTP n_max=3, KV q4_0, flash-attn).
  # n_max 2->3 (2026-08-19): sweep local (prompt fixo, temp=0, 200 tokens) — 1:24,5 t/s,
  # 2:27,6, 3:28,5 (draft acceptance 0.73), 4:24,5, 6:20,7 t/s. 3 é o pico; acima disso a
  # taxa de aceitação cai e o custo de gerar drafts errados supera o ganho.
  qwen3.8-27b-iq4xs:
    cmd: >
      ${server}
      -m ${models}/Qwen3.8-27B-IQ4_XS.gguf
      --reasoning off
      --ctx-size 32768
      --parallel 1
      --threads-http 2
      -t 8
      --n-gpu-layers 58
      --cache-ram 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --host 127.0.0.1
      --port ${PORT}
    ttl: 3600

  # Dense 9B (2026-08-15) — opção de chat adicional, NÃO é o default
  # (LOCAL_LLAMA_MODEL continua qwen3-14b; fastModel/analysisModel do
  # LazyInvest continuam intocados). -ngl 999 confirmado ao vivo: cabe
  # inteiro na GPU sozinho (~6,5GB de 16,3GB usados, sem offload parcial).
  # --reasoning off: mesmo motivo do 3.6-35b/3.8-27b — medido ao vivo que
  # o template ignora /no_think (queima tokens de thinking mesmo assim);
  # chat_template_kwargs.enable_thinking=false funciona pra quem quiser
  # thinking de volta. Sem --spec-type draft-mtp: `llama-gguf` não achou
  # tensores nextn/MTP neste GGUF (diferente do 3.8-27b).
  qwen3.5-9b:
    cmd: >
      ${server}
      -m ${models}/Qwen3.5-9B-Q4_K_M.gguf
      --reasoning off
      --ctx-size 32768
      --parallel 1
      --threads-http 2
      -t 8
      --n-gpu-layers 999
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --host 127.0.0.1
      --port ${PORT}
    ttl: 3600
