server:
  # 8091: cvm-pdf-processor usa 8085, llama-swap 8080, embeddings 8082, cvm-ingestor 8090.
  port: 8091

llm-proxy:
  llama-cpp:
    # Points at llama-swap (not raw llama-server): it hot-swaps qwen3-14b <-> qwen3.6-35b
    # on demand based on the "model" field the proxy forwards, and manages VRAM.
    base-url: ${LOCAL_LLAMA_URL:http://localhost:8080}
    api-key: ${LOCAL_LLAMA_API_KEY:}
    default-model: ${LOCAL_LLAMA_MODEL:qwen3-14b}
  openrouter:
    # base-url stops before /v1; the proxy appends /v1/chat/completions.
    base-url: ${OPENROUTER_URL:https://openrouter.ai/api}
    api-key: ${OPENROUTER_API_KEY:}
    default-model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  embeddings:
    # bge-m3 via llama-swap (grupo "embeddings", CPU/RAM): sobe sob demanda e convive
    # com o modelo de chat carregado — ninguém mais gerencia processo de embed.
    base-url: ${EMBED_URL:http://localhost:8080}
    api-key: ${EMBED_API_KEY:}
    default-model: ${EMBED_MODEL:bge-m3}
  rerank:
    # bge-reranker-v2-m3 via llama-swap (mesmo grupo "embeddings", GPU) — estágio 2 do
    # retrieval do LazyInvest. Mesma base-url do llama-cpp (:8080); llama-swap roteia pelo
    # campo "model" do corpo, igual chat/embeddings.
    base-url: ${RERANK_URL:http://localhost:8080}
    api-key: ${RERANK_API_KEY:}
    default-model: ${RERANK_MODEL:bge-reranker-v2-m3}
  routing:
    # In "auto", a speed-hinted request under this many estimated tokens goes to OpenRouter.
    speed-token-threshold: ${LLM_SPEED_TOKEN_THRESHOLD:8000}
    # llama.cpp prefill on ~60k-token docs is slow; keep this above the client timeout.
    read-timeout: ${LLM_READ_TIMEOUT:15m}
  # Shared secret required (X-Admin-Token header) to read/write /v1/config/**. Empty/absent
  # means every request to that path is denied (fail-closed), never opened by omission.
  admin-token: ${LLM_PROXY_ADMIN_TOKEN:}
  # Chat-capable ids from llama-swap.yaml's "chat" group (see /v1/models/chat) — llama-swap's
  # own /v1/models doesn't expose group membership, so this is the only source of truth.
  local-chat-models: ${LOCAL_CHAT_MODELS:qwen3-14b,qwen3.6-35b,qwen3.8-27b,qwen3.5-9b}
